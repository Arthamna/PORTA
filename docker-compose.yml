services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: porta-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Porta@12345"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - porta-sql-data:/var/opt/mssql
      - ./database:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  porta-sql-data:
